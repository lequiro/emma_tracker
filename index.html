<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff8a65">
<title>Emma - Registro rápido</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
body{font-family:-apple-system,Roboto,Arial,sans-serif;background:#f5f0eb;margin:0;padding:16px;color:#333;}
h1{font-size:20px;text-align:center;margin:8px 0 20px;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card h2{font-size:14px;color:#888;margin:0 0 12px;text-transform:uppercase;letter-spacing:.03em;}
.fila{display:flex;gap:10px;}
button{flex:1;font-size:16px;padding:16px 8px;border:none;border-radius:10px;background:#e8ddf0;color:#4a2e6b;font-weight:600;}
button:active{opacity:.7;}
button.activo{background:#ff8a65;color:#fff;}
button.rapido{background:#d9ecdd;color:#2e6b3f;padding:14px 8px;font-size:15px;}
button:disabled{opacity:.4;}
.timer{text-align:center;font-size:28px;font-weight:700;margin:10px 0;color:#ff8a65;}
.msg{text-align:center;font-size:13px;color:#666;min-height:18px;margin-top:8px;}
.offline-info{text-align:center;font-size:12px;color:#a83e2c;margin:-10px 0 14px;min-height:14px;}
.registro{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:14px;}
.registro:last-child{border-bottom:none;}
.registro .info{flex:1;}
.registro .tipo{font-weight:600;text-transform:capitalize;}
.registro .sub{color:#888;font-size:12px;}
.editar{background:none;border:none;font-size:18px;flex:none;width:36px;padding:6px;}
.panel-editar{display:none;flex-direction:column;gap:8px;margin-top:8px;}
.panel-editar .fila-edit{display:flex;gap:8px;}
.panel-editar input{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;}
.panel-editar button{flex:none;padding:8px 12px;font-size:13px;}
.panel-editar button.guardar{background:#d9ecdd;color:#2e6b3f;}
.panel-editar button.eliminar{background:#fbdcd7;color:#a83e2c;}
</style>
</head>
<body>
<h1>Emma 👶</h1>
<div class="offline-info" id="indicadorCola"></div>

<div class="card">
<h2>Cronómetro</h2>
<div class="fila">
<button id="btnTeta" onclick="toggle('teta')">🍼 Teta</button>
<button id="btnSueno" onclick="toggle('sueño')">😴 Sueño</button>
</div>
<div class="timer" id="timer"></div>
<div class="msg" id="msgCronometro"></div>
</div>

<div class="card">
<h2>Registro rápido</h2>
<div class="fila">
<button class="rapido" onclick="registrarRapido('pis')">💧 Pis</button>
<button class="rapido" onclick="registrarRapido('caca')">💩 Caca</button>
<button class="rapido" onclick="registrarRapido('pañal')">🧷 Pañal</button>
</div>
<div class="msg" id="msgRapido"></div>
</div>

<div class="card">
<h2>Últimos registros</h2>
<div id="listaUltimos">Cargando...</div>
</div>

<script>
var URL_APP = 'https://script.google.com/macros/s/AKfycbyXtWBPgti9NjI81G0Ce8YmnaSsHAHd_MKNSY3ixm8uaS0pE6P6yPPqiVxrY1i4FOJbLQ/exec';
var tipoEnCurso = null;
var inicioEnCurso = null;
var intervalId = null;

function fetchConTimeout(url, opciones){
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 8000);
  opciones = opciones || {};
  opciones.signal = controller.signal;
  return fetch(url, opciones).then(function(r){ clearTimeout(timeoutId); return r.json(); }, function(err){ clearTimeout(timeoutId); throw err; });
}

function leerCola(){
  try { return JSON.parse(localStorage.getItem('cola_pendiente') || '[]'); } catch(e){ return []; }
}
function guardarCola(cola){
  try { localStorage.setItem('cola_pendiente', JSON.stringify(cola)); } catch(e){}
  actualizarIndicadorCola();
}
function actualizarIndicadorCola(){
  var el = document.getElementById('indicadorCola');
  if (!el) return;
  var n = leerCola().length;
  el.textContent = n > 0 ? ('⏳ ' + n + (n === 1 ? ' registro pendiente de enviar' : ' registros pendientes de enviar')) : '';
}

function llamar(body){
  if (!body.cliente_hora) body.cliente_hora = new Date().toISOString();
  return fetchConTimeout(URL_APP, { method: 'POST', body: JSON.stringify(body) }).catch(function(err){
    var cola = leerCola();
    cola.push(body);
    guardarCola(cola);
    return { ok: true, offline: true, mensaje: 'Sin conexión: guardado en el celular, se enviará solo apenas vuelva la señal.' };
  });
}
function consultar(action){
  return fetchConTimeout(URL_APP + '?action=' + action).catch(function(err){ return { ok: false, offline: true }; });
}

function vaciarCola(){
  var cola = leerCola();
  if (cola.length === 0) return;
  fetchConTimeout(URL_APP, { method: 'POST', body: JSON.stringify(cola[0]) }).then(function(res){
    var colaActual = leerCola();
    colaActual.shift();
    guardarCola(colaActual);
    cargarUltimos();
    vaciarCola();
  }).catch(function(err){ /* sigue sin conexión, se reintenta más tarde */ });
}

window.addEventListener('online', vaciarCola);
setInterval(vaciarCola, 20000);

function formatearTiempo(segundos){
  var m = Math.floor(segundos / 60);
  var s = segundos % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function actualizarBotones(){
  var btnTeta = document.getElementById('btnTeta');
  var btnSueno = document.getElementById('btnSueno');
  btnTeta.classList.remove('activo'); btnSueno.classList.remove('activo');
  btnTeta.disabled = false; btnSueno.disabled = false;
  btnTeta.textContent = '🍼 Teta';
  btnSueno.textContent = '😴 Sueño';
  if (tipoEnCurso === 'teta'){ btnTeta.classList.add('activo'); btnTeta.textContent = '⏹ Detener'; btnSueno.disabled = true; }
  if (tipoEnCurso === 'sueño'){ btnSueno.classList.add('activo'); btnSueno.textContent = '⏹ Detener'; btnTeta.disabled = true; }
}

function tick(){
  if (!inicioEnCurso) return;
  var segundos = Math.floor((new Date() - inicioEnCurso) / 1000);
  document.getElementById('timer').textContent = formatearTiempo(segundos);
}

function toggle(tipo){
  var msg = document.getElementById('msgCronometro');
  if (tipoEnCurso === tipo){
    var tipoQueTerminaba = tipoEnCurso;
    tipoEnCurso = null; inicioEnCurso = null;
    clearInterval(intervalId);
    document.getElementById('timer').textContent = '';
    actualizarBotones();
    msg.textContent = 'Guardando...';
    llamar({ accion: 'detener' }).then(function(res){
      msg.textContent = res.mensaje;
      if (!res.ok){ tipoEnCurso = tipoQueTerminaba; actualizarBotones(); return; }
      cargarUltimos();
    });
  } else if (!tipoEnCurso) {
    tipoEnCurso = tipo; inicioEnCurso = new Date();
    actualizarBotones();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
    tick();
    msg.textContent = '';
    llamar({ accion: 'iniciar', tipo_evento: tipo }).then(function(res){
      if (!res.ok){ msg.textContent = res.mensaje; tipoEnCurso = null; inicioEnCurso = null; clearInterval(intervalId); document.getElementById('timer').textContent = ''; actualizarBotones(); return; }
      if (res.estado){ inicioEnCurso = new Date(res.estado.inicio); }
      if (res.offline){ msg.textContent = res.mensaje; }
    });
  }
}

function registrarRapido(tipo){
  var msg = document.getElementById('msgRapido');
  msg.textContent = 'Guardado ✓';
  llamar({ tipo_evento: tipo }).then(function(res){
    msg.textContent = res.mensaje;
    cargarUltimos();
  });
}

function pintarUltimos(registros){
  var cont = document.getElementById('listaUltimos');
  if (!registros || registros.length === 0){ cont.innerHTML = '<p style="color:#888;font-size:13px">Sin registros todavía.</p>'; return; }
  cont.innerHTML = '';
  registros.forEach(function(r){
    var div = document.createElement('div');
    div.innerHTML = '<div class="registro">' +
      '<div class="info"><div class="tipo">' + r.tipo_evento + '</div>' +
      '<div class="sub">' + r.timestamp + (r.duracion_minutos !== '' ? ' · ' + r.duracion_minutos + ' min' : '') + (r.notas ? ' · ' + r.notas : '') + '</div></div>' +
      '<button class="editar" onclick="mostrarEdicion(' + r.fila + ')">✏️</button></div>' +
      '<div class="panel-editar" id="editar-' + r.fila + '">' +
      '<div class="fila-edit">' +
      '<input type="number" id="dur-' + r.fila + '" placeholder="minutos" value="' + (r.duracion_minutos === '' ? '' : r.duracion_minutos) + '">' +
      '<input type="text" id="notas-' + r.fila + '" placeholder="notas" value="' + (r.notas || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div class="fila-edit">' +
      '<button class="guardar" onclick="guardarEdicion(' + r.fila + ')">Guardar</button>' +
      '<button class="eliminar" onclick="eliminarFila(' + r.fila + ')">🗑 Eliminar</button></div></div>';
    cont.appendChild(div);
  });
}

function cargarUltimos(){
  consultar('ultimos').then(function(res){ if (res.ok) pintarUltimos(res.registros); });
}

function mostrarEdicion(fila){
  var panel = document.getElementById('editar-' + fila);
  panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
}

function guardarEdicion(fila){
  var dur = document.getElementById('dur-' + fila).value;
  var notas = document.getElementById('notas-' + fila).value;
  llamar({ accion: 'corregir', fila: fila, duracion_minutos: dur, notas: notas }).then(function(res){
    cargarUltimos();
  });
}

function eliminarFila(fila){
  if (!confirm('¿Eliminar este registro?')) return;
  llamar({ accion: 'eliminar', fila: fila }).then(function(res){
    cargarUltimos();
  });
}

function iniciarPagina(){
  actualizarIndicadorCola();
  vaciarCola();
  consultar('inicial').then(function(res){
    if (!res.ok) return;
    if (res.estado && res.estado.activo){
      tipoEnCurso = res.estado.tipo_evento;
      inicioEnCurso = new Date(res.estado.inicio);
      actualizarBotones();
      clearInterval(intervalId);
      intervalId = setInterval(tick, 1000);
      tick();
    }
    pintarUltimos(res.registros);
  });
}

function resincronizar(){
  vaciarCola();
  consultar('estado').then(function(res){
    if (!res.ok) return;
    if (res.activo){
      tipoEnCurso = res.tipo_evento;
      inicioEnCurso = new Date(res.inicio);
    } else {
      tipoEnCurso = null; inicioEnCurso = null;
      clearInterval(intervalId);
      document.getElementById('timer').textContent = '';
    }
    actualizarBotones();
    tick();
    cargarUltimos();
  });
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden){ resincronizar(); }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(err){ console.log('Error al registrar service worker', err); });
  });
}

iniciarPagina();
</script>
</body>
</html>
